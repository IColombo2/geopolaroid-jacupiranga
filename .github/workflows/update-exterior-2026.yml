name: Atualizar exterior 2026

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-exterior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar novo snapshot do exterior
        run: python scripts/update_exterior.py
      - name: Publicar somente se houver avanço
        run: |
          if git diff --quiet -- painel-tse-2turno-2026/pretotalizacao-exterior.json; then
            echo "Sem novos dados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel-tse-2turno-2026/pretotalizacao-exterior.json
          git commit -m "Auto-update exterior pretotalization"
          git push
